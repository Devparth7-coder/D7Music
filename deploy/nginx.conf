# D7music — production reverse proxy (nginx ≥ 1.25).
#
# This is the file the API tier assumes when you set TRUST_PROXY=true, so the pairing matters:
# nginx must set X-Forwarded-For, and :4000 must not be reachable directly. If clients can reach
# the port themselves, they can pick their own request.ip and therefore their own rate-limit bucket.
#
# deploy/nginx.compose.conf is the same routing without TLS, for the `edge` compose profile.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream d7_api {
  # One entry per API node. No `ip_hash`: sessions live in a cookie + Postgres, and rate-limit
  # counters are shared only when REDIS_URL is set — so sticky routing does not fix a missing
  # Redis, it just hides it.
  server 127.0.0.1:4000 max_fails=3 fail_timeout=15s;
  keepalive 32;
}

server {
  listen 80;
  server_name d7.example.com api.d7.example.com;
  # ACME HTTP-01 has to stay reachable over cleartext; everything else moves up.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name d7.example.com api.d7.example.com;

  ssl_certificate     /etc/letsencrypt/live/d7.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/d7.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # The app's own upload cap is UPLOAD_MAX_MB (default 60). Keep this slightly above it: a
  # request nginx rejects never reaches the API, so the client gets an opaque 413 instead of
  # the app's explanation of the size limit.
  client_max_body_size 64m;
  client_body_timeout 120s;

  access_log /var/log/nginx/d7.access.log combined buffer=32k flush=5s;
  error_log  /var/log/nginx/d7.error.log warn;

  gzip on;
  gzip_types application/json text/plain;
  # Audio is already compressed and served with byte ranges; gzipping it wastes CPU and breaks
  # Content-Length/Range accounting in some players.
  gzip_disable "msie6";

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id      $request_id;
  proxy_set_header Connection        "";
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # ---- signed audio streams ----------------------------------------------
  # Range requests must survive the hop: players seek with them. Do not let a
  # CDN in front cache one signed URL across viewers (the HMAC binds the URL to
  # the viewer) and do not strip the sig/exp query args.
  location /api/stream/ {
    proxy_pass http://d7_api;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "private, no-store" always;
  }

  location /media/ {
    proxy_pass http://d7_api;
    proxy_buffering off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location /cdn/ {
    proxy_pass http://d7_api;
    proxy_buffering off;
    expires 7d;
  }

  # ---- API ---------------------------------------------------------------
  location /api/ {
    proxy_pass http://d7_api;
  }

  # Capability report with catalog counts and provider reasons: keep it off the public internet.
  location = /api/health {
    allow 10.0.0.0/8;      # your monitoring CIDRs
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://d7_api;
    access_log off;
  }

  location = /api/version {
    proxy_pass http://d7_api;
    access_log off;
  }

  # Stripe (or any gateway) webhook: no buffering, and never gzip the body — the app verifies
  # the HMAC over the exact bytes it received.
  location /api/webhooks/ {
    proxy_pass http://d7_api;
    proxy_buffering off;
    proxy_read_timeout 30s;
  }

  # ---- front end (pending: apps/web) -------------------------------------
  location / {
    proxy_pass http://127.0.0.1:3000;   # `next start` / the web container
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;   # HMR in dev, nothing in prod
  }
}
