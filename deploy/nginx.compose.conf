# Same routing as nginx.conf without TLS, for the `edge` compose profile:
#
#   docker compose --profile edge up
#   curl -s localhost:8080/api/version
#
# TLS terminates elsewhere here on purpose — do not put a real secret behind this file.
# The production copy (deploy/nginx.conf) is the one with certificates, HSTS and the
# /api/health allow-list.

upstream d7_api {
  server api:4000;
  keepalive 8;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 64m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";

  location /api/stream/ {
    proxy_pass http://d7_api;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /media/ { proxy_pass http://d7_api; proxy_buffering off; }
  location /cdn/   { proxy_pass http://d7_api; proxy_buffering off; }
  location /       { proxy_pass http://d7_api; }
}
