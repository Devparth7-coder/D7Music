# CI for D7music. Two jobs: prove the code, then prove the image.
#
# Nothing here needs a Postgres or Redis service: the test suite boots the real Fastify app
# against PGlite (an actual PostgreSQL compiled to WASM), and the image smoke test runs the same
# driver. That is deliberate — a CI job that has to stand up three services to say "ok" tends to be
# deleted the first time it flakes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is the gate; keep logs readable.
  LOG_LEVEL: warn

jobs:
  check:
    name: typecheck · env contract · tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor in package.json `engines`; 22 is what production should run (and avoids
        # the EBADENGINE warning from cookie@2).
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (production deps only — the container runs `node --import tsx`)
        run: npm ci --omit=dev

      - name: Install dev deps for the checks
        run: npm ci

      - name: Env contract matches the docs
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (41 integration tests, ephemeral PostgreSQL)
        run: npm test

      - name: Boot guardrails fire without an env file
        # The three production guards from docs/ENVIRONMENT.md, asserted as a user would hit them.
        run: |
          set -euo pipefail
          SECRET=0123456789012345678901234567890123
          guard() { # want, then the command to run
            local want="$1"; shift
            local out
            out="$("$@" 2>&1 || true)"
            echo "$out" | grep -qF "$want" || { echo "expected to see: $want"; echo "$out"; exit 1; }
            echo "ok: $want"
          }
          guard 'APP_SECRET must be set'                 env -i PATH="$PATH" NODE_ENV=production APP_SECRET=                                    node --import tsx -e 'import("@d7/config")'
          guard 'pglite is not a production datastore'   env -i PATH="$PATH" NODE_ENV=production APP_SECRET=$SECRET DB_DRIVER=pglite node --import tsx -e 'import("@d7/config")'
          guard 'DATABASE_URL is required'               env -i PATH="$PATH" NODE_ENV=production APP_SECRET=$SECRET DB_DRIVER=postgres DATABASE_URL= node --import tsx -e 'import("@d7/config")'

  image:
    name: build · run · health
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t d7music:${{ github.sha }} .

      - name: Migrations apply inside the image
        run: |
          docker run --rm \
            -e DB_DRIVER=pglite -e PGLITE_DIR=/tmp/pg \
            -e NODE_ENV=development \
            d7music:${{ github.sha }} \
            node --import tsx packages/database/src/cli.ts migrate | tee /tmp/migrate.log
          # Any number of migrations is fine; "applied=0" after a fresh image would not be.
          grep -qE 'migrations applied=[1-9]' /tmp/migrate.log

      - name: Boot the API and probe it
        run: |
          docker run -d --name d7api \
            -e NODE_ENV=development -e DB_DRIVER=pglite -e PGLITE_DIR=/tmp/pg \
            -e STORAGE_DRIVER=local -e STORAGE_LOCAL_DIR=/tmp/store \
            -e MAIL_OUTBOX_DIR=/tmp/outbox -e MUSIC_PROVIDER=local_library \
            -e APP_SECRET=ci-only-secret-0123456789abcdef \
            -p 127.0.0.1:4000:4000 \
            d7music:${{ github.sha }}
          ok=""
          for i in $(seq 1 40); do
            sleep 3
            if curl -fsS http://127.0.0.1:4000/api/health; then ok=1; break; fi
          done
          test -n "$ok" || { docker logs d7api; exit 1; }
          echo
          curl -fsS http://127.0.0.1:4000/api/version
          # /api/config must not leak secrets, and must describe capabilities honestly.
          body="$(curl -fsS http://127.0.0.1:4000/api/config)"
          ! grep -q APP_SECRET <<<"$body"
          grep -q '"assistantLlm":false' <<<"$body"   # no LLM creds in CI, so the flag must be false
          docker rm -f d7api

      # Publishing is a deployment decision, not a CI default: uncomment once a registry exists.
      # - uses: docker/login-action@v3
      #   with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN } }
      # - run: docker tag d7music:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }} && docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
